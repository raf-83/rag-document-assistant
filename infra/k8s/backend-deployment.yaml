apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/raf-83/rag-document-assistant-backend:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: APP_AI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: APP_AI_OPENAI_API_KEY

            - name: APP_SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: APP_SECURITY_JWT_SECRET

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_PASSWORD

          volumeMounts:
            - name: backend-storage
              mountPath: /data/documents

      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: backend-storage
