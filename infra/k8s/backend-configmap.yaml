apiVersion: v1
kind: ConfigMap

metadata:
  name: backend-config

data:
  SPRING_PROFILES_ACTIVE: "local"

  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/ai_document_vault"
  SPRING_DATASOURCE_USERNAME: "postgres"

  APP_STORAGE_LOCAL_BASE_PATH: "/data/documents"

  APP_AI_HYBRID_SEARCH_RRF_K: "60"
  APP_AI_HYBRID_SEARCH_SEMANTIC_WEIGHT: "0.60"
  APP_AI_HYBRID_SEARCH_KEYWORD_WEIGHT: "0.40"
  APP_AI_HYBRID_SEARCH_CANDIDATE_MULTIPLIER: "3"
  APP_AI_HYBRID_SEARCH_MAX_CANDIDATE_LIMIT: "150"
  APP_AI_HYBRID_SEARCH_MAX_CHUNKS_PER_DOCUMENT: "3"
  APP_AI_HYBRID_SEARCH_MAX_DOCUMENT_BONUS_SHARE: "0.15"

  APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: "900"
  APP_SECURITY_REFRESH_TOKEN_EXPIRATION_SECONDS: "604800"
  APP_SECURITY_EMAIL_VERIFICATION_TOKEN_EXPIRATION_SECONDS: "86400"
  APP_SECURITY_PASSWORD_RESET_TOKEN_EXPIRATION_SECONDS: "3600"

  APP_STORAGE_MAX_FILE_SIZE_BYTES: "10485760"
  APP_STORAGE_ALLOWED_EXTENSIONS: "pdf,jpg,jpeg,png"
  APP_STORAGE_ALLOWED_MIME_TYPES: "application/pdf,image/jpeg,image/png"
  APP_STORAGE_MAX_PDF_PAGES: "50"

  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "10MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "10MB"

  APP_PROCESSING_CHUNKING_MAX_CHUNK_CHARS: "1800"
  APP_PROCESSING_CHUNKING_OVERLAP_CHARS: "250"
  APP_PROCESSING_CHUNKING_MIN_CHUNK_CHARS: "300"
  APP_PROCESSING_CHUNKING_STRATEGY: "PARAGRAPH_AWARE_V1"
